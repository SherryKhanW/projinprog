<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Students</title>
</head>
<body>
  <h1>Students</h1>
  <h2>Average competency</h2>
  <ul id="averages"></ul>
  <p id="count"></p>
  <ul id="names"></ul>
  <script>
    fetch("/api/skill-averages")
      .then((response) => response.json())
      .then((averages) => {
        const list = document.getElementById("averages");
        for (const row of averages) {
          const item = document.createElement("li");
          item.textContent = row.skill + ": " + row.average;
          list.appendChild(item);
        }
      });

    fetch("/api/names")
      .then((response) => response.json())
      .then((names) => {
        document.getElementById("count").textContent = names.length + " students";
        const list = document.getElementById("names");
        for (const name of names) {
          const item = document.createElement("li");
          item.textContent = name;
          list.appendChild(item);
        }
      });
  </script>
</body>
</html>
